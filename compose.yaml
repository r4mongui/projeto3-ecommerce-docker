services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ecommerce", "-d", "ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://ecommerce:ecommerce@banco:5432/ecommerce}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/orders/0').then(r => process.exit(r.status === 404 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

volumes:
  dados_postgres:
